version: '3.8'

networks:
  aponti-overlay:
    driver: overlay
    attachable: true

volumes:
  db-data:
    driver: local

services:
  # Banco de Dados (Requisito: 1 réplica, restrição de nó e volume persistente)
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aponti_user
      POSTGRES_PASSWORD: aponti_secure_password
      POSTGRES_DB: aponti_delivery
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - aponti-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Serviços Internos: 3 réplicas cada, sem portas externas mapeadas
  product:
    image: aponti-product:v1
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=database
    networks:
      - aponti-overlay
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  inventory:
    image: aponti-inventory:v1
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DB_HOST=database
    networks:
      - aponti-overlay
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  order:
    image: aponti-order:v1
    environment:
      - PORT=3003
      - NODE_ENV=production
      - DB_HOST=database
    networks:
      - aponti-overlay
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # API Gateway: 2 réplicas, único ponto com porta exposta publicamente
  api-gateway:
    image: aponti-gateway:v1
    environment:
      - PORT=8080
      - NODE_ENV=production
      - PRODUCT_SERVICE_URL=http://product:3001
      - INVENTORY_SERVICE_URL=http://inventory:3002
      - ORDER_SERVICE_URL=http://order:3003
    ports:
      - "8080:8080"
    networks:
      - aponti-overlay
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 256M